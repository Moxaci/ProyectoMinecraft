<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis proyectos — CraftLog</title>
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
</head>
<body>

  <div class="app-shell">

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <a href="proyecto.html" class="btn btn-primary btn-full" id="btnNuevoProyecto">
          + Nuevo proyecto
        </a>
      </div>

      <div class="sidebar-history" id="sidebarHistory">
        <div class="history-section">
          <div class="history-label">Reciente</div>
          <a href="proyecto.html" class="history-item">
            <div class="history-item-icon" style="background:var(--mc-stone)"></div>
            Castillo de Piedra
          </a>
        </div>
      </div>

      <div style="padding:var(--pad-md); border-top:2px solid var(--border);">
        <div class="flex items-center gap-sm">
          <div class="avatar">AK</div>
          <div style="flex:1; min-width:0;">
            <div style="font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Antony Kevin</div>
            <div class="text-xs text-muted">Programación</div>
          </div>
        </div>
      </div>
    </aside>

    <div class="main-content">

      <header class="content-header">
        <div class="flex items-center gap-sm">
          <button class="toggle-btn" id="toggleSidebar" aria-label="Mostrar/ocultar menú">☰</button>
          <a href="index.html" class="navbar-brand" style="text-decoration:none;">
            <div>
              <div class="brand-text" style="font-size:9px;">CRAFTLOG</div>
            </div>
          </a>
        </div>

        <span class="content-header-title">Vista general</span>

        <div class="flex items-center gap-sm">
          <input type="search" class="search-bar" placeholder="Buscar proyecto..." style="width:180px; height:32px; font-size:12px;" id="searchProjects">

          <div class="dropdown" id="profileDropdown">
            <button class="avatar" id="profileBtn" aria-label="Menú de perfil" onclick="toggleDropdown()">AK</button>
            <div class="dropdown-menu" id="dropdownMenu" role="menu">
              <div style="padding:10px 16px; border-bottom:1px solid var(--border);">
                <div style="font-size:13px; font-weight:500;">Antony Kevin</div>
                <div class="text-xs text-muted">Programación</div>
              </div>
              
              <button class="dropdown-item" id="btnCambiarFoto">
                Cambiar foto de perfil
              </button>
              
              <div class="dropdown-sep"></div>
              
              <div style="padding:6px 16px;">
                <div class="text-xs text-muted" style="margin-bottom:6px; font-family:var(--font-pixel); font-size:7px; letter-spacing:1px;">ACCESIBILIDAD</div>
                <div class="flex flex-col gap-xs">
                  <div class="flex gap-sm">
                    <button id="theme-normal" class="btn btn-secondary btn-xs" style="flex:1" onclick="setTheme('normal')">Estándar</button>
                    <button id="theme-mc" class="btn btn-secondary btn-xs" style="flex:1" onclick="setTheme('mc')">Minecraft</button>
                  </div>
                  <button id="theme-blind" class="btn btn-secondary btn-xs" style="width:100%; margin-top:4px;" onclick="setTheme('colorblind')">👁️ Modo Daltónico</button>
                </div>
              </div>
              
              <div class="dropdown-sep"></div>
              <a href="login.html" class="dropdown-item danger">Cerrar sesión</a>
            </div>
          </div>
        </div>
      </header>

      <div class="content-body">

        <div class="stats-row" style="margin-bottom:var(--pad-lg)">
          <div class="stat-card">
            <div class="stat-label">Proyectos totales</div>
            <div class="stat-value accent" id="statProyectos">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Materiales calculados</div>
            <div class="stat-value gold" id="statMateriales">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-row-sub">
              <div class="stat-label">Horas de horneado</div>
              <div class="stat-value green" id="statHoras">0</div>
            </div>
          </div>
        </div>

        <div class="flex items-center justify-between mb-md">
          <span style="font-family:var(--font-pixel); font-size:9px; color:var(--text-secondary); letter-spacing:1px;">TUS PROYECTOS</span>
          <div class="flex gap-sm">
            <button class="btn btn-ghost btn-sm">Ordenar</button>
            <button class="btn btn-ghost btn-sm">Filtrar</button>
          </div>
        </div>

        <div class="projects-grid" id="projectsGrid">

          <div class="project-card" onclick="window.location.href='proyecto.html'">
            <div class="project-card-header">
              <div class="pixel-block block-stone project-block-icon" style="--block-img: url('IMG/stone.png');"></div>
              <div>
                <div class="project-card-name">Castillo de Piedra</div>
                <div class="project-card-meta">Modificado hoy</div>
              </div>
            </div>
            <div class="project-card-footer">
              <span class="badge badge-stone">18 stacks</span>
              <span class="text-xs text-muted">→</span>
            </div>
          </div>

          <div class="project-card add-card" id="btnAddCard" onclick="crearProyecto()">
            <div style="font-size:32px; font-family:var(--font-pixel); line-height:1;">+</div>
            <div style="font-family:var(--font-pixel); font-size:8px; letter-spacing:0.5px;">Nuevo proyecto</div>
          </div>

        </div>

      </div>
    </div>

  </div>

<script>
    // Mostrar/ocultar Sidebar de forma fluida
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });

    // Menú de perfil dropdown
    function toggleDropdown() {
        document.getElementById('profileDropdown').classList.toggle('open');
    }

    document.addEventListener('click', (e) => {
        const dd = document.getElementById('profileDropdown');
        if (dd && !dd.contains(e.target)) dd.classList.remove('open');
    });

    // Lógica de temas globales basados en clases del body
    function setTheme(mode) {
        document.body.classList.remove('colorblind-mode', 'mc-classic-theme');
        document.querySelectorAll('.dropdown-menu .btn').forEach(b => b.classList.remove('active-theme'));

        if (mode === 'colorblind') {
            document.body.classList.add('colorblind-mode');
            document.getElementById('theme-blind').classList.add('active-theme');
        } else if (mode === 'mc') {
            document.body.classList.add('mc-classic-theme');
            document.getElementById('theme-mc').classList.add('active-theme');
        } else {
            document.getElementById('theme-normal').classList.add('active-theme');
        }
        localStorage.setItem('craftlog_theme', mode);
    }

    // Inicializar el tema guardado
    const savedTheme = localStorage.getItem('craftlog_theme') || 'normal';
    setTheme(savedTheme);
</script>

<script src="JS/dashboard.js"></script>
</body>
</html>
