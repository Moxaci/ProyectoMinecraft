<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis proyectos — CraftLog</title>
  <link rel="icon" type="image/png" href="img/Logo.png">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/dashboard.css">
</head>
<body>

  <div class="app-shell">

    <!-- ========== SIDEBAR UNIFICADO ========== -->
<aside class="sidebar" id="sidebar">
  
  <!-- Botón Nuevo Proyecto (Estilo secundario) -->
  <div style="padding: 16px;">
    <a href="workspace.html" class="btn btn-secondary" style="width: 100%; justify-content: center;" id="btnNuevoProyecto">
      + Nuevo Proyecto
    </a>
  </div>

  <!-- Lista de proyectos recientes -->
  <div class="sidebar-history" id="sidebarHistory" style="flex: 1; padding: 0 16px; overflow-y: auto;">
    <div class="history-section">
      <div style="font-family: var(--font-pixel); font-size: 7px; color: var(--text-muted); margin-bottom: 8px;">Reciente</div>
      
      <!-- Ejemplo de ítem (Tus scripts en JS lo llenarán dinámicamente) -->
      <a href="workspace.html" class="history-item">
        <div class="history-item-icon" style="background:var(--mc-stone)"></div>
        Castillo de Piedra
      </a>
    </div>
  </div>

  <!-- Perfil de usuario (Con el borde estructurado) -->
  <div style="padding: 16px; border-top: 1px solid var(--border-strong);">
    <div class="flex items-center gap-sm">
      <!-- Avatar estructurado con los colores de tu interfaz -->
      <div class="avatar" style="width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; background: #47D7E5; color: #1a1a2e; border-radius: 50%; font-weight: bold; font-size: 12px;">AK</div>
      <div style="flex:1; min-width:0;">
        <div style="font-size:12px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Antony Kevin</div>
      </div>
    </div>
  </div>

</aside>

    <div class="main-content">

      <!-- ===== HEADER (Estilo Proyecto) ===== -->
      <header style="height: 60px; background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--border);">
  
         <!-- Izquierda: Botón de menú y título -->
        <div style="display: flex; align-items: center; gap: 15px;">
      |   <button id="toggleSidebar" class="btn btn-secondary" style="padding: 6px 12px; font-size: 16px; cursor: pointer; border-radius: 4px;">
           ☰
          </button>
          <h2 style="margin: 0; font-family: var(--font-pixel, sans-serif); font-size: 20px; color: var(--text);">
              Dashboard
          </h2>
  </div>

  <!-- Derecha: Perfil desplegable -->
  <div style="display: flex; align-items: center; gap: 15px;">
    <div class="dropdown" id="profileDropdown" style="position: relative;">
      
      <!-- Se cambió el ID a profileBtn para que dashboard.js lo reconozca -->
      <button id="profileBtn" onclick="toggleDropdown()" class="btn btn-secondary" style="border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-weight: bold; cursor: pointer; padding: 0;">
        AK
      </button>
      
      <!-- Menú desplegable -->
      <div class="dropdown-menu" id="dropdownMenu" style="display: none; position: absolute; right: 0; top: 120%; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 6px; width: 220px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;">
        
        <!-- Información del Usuario -->
        <div style="padding: 10px 16px; border-bottom: 1px solid var(--border);">
          <div style="font-size: 13px; font-weight: 500; color: var(--text);" id="dropdownUserName">Antony Kevin</div>
          <div style="font-size: 11px; color: gray;" id="dropdownUserEmail">correo@ejemplo.com</div>
        </div>

        <!-- Botones de Tema Visual -->
        <div style="padding: 10px 16px; border-bottom: 1px solid var(--border);">
          <div style="font-size: 10px; color: gray; margin-bottom: 8px; letter-spacing: 0.5px;">TEMA VISUAL</div>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            <button id="theme-normal" class="btn" onclick="setTheme('normal')" style="text-align: left; padding: 6px 10px; border-radius: 4px; background: transparent; border: 1px solid var(--border); cursor: pointer; color: var(--text); font-size: 12px;">
              Normal
            </button>
            <button id="theme-mc" class="btn" onclick="setTheme('mc')" style="text-align: left; padding: 6px 10px; border-radius: 4px; background: transparent; border: 1px solid var(--border); cursor: pointer; color: var(--text); font-size: 12px;">
              Minecraft Clásico
            </button>
            <button id="theme-blind" class="btn" onclick="setTheme('colorblind')" style="text-align: left; padding: 6px 10px; border-radius: 4px; background: transparent; border: 1px solid var(--border); cursor: pointer; color: var(--text); font-size: 12px;">
              Modo Daltónico
            </button>
          </div>
        </div>

        <!-- Cerrar Sesión -->
        <a href="login.html" class="dropdown-item danger" style="display: block; padding: 12px 16px; color: #ff5555; text-decoration: none; font-size: 13px;">
          Cerrar sesión
        </a>
      </div>
      
      </header>

      <div class="content-body">

        <div class="stats-row" style="margin-bottom:var(--pad-lg)">
          <div class="stat-card">
            <div class="stat-label">Proyectos totales</div>
            <div class="stat-value accent" id="statProyectos">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Materiales calculados</div>
            <div class="stat-value gold" id="statMateriales">0</div>
          </div>
        </div>

        <div class="projects-grid" id="projectsGrid">

          <div class="project-card" onclick="window.location.href='workspace.html'">
            <div class="project-card-header">
              <div class="pixel-block block-stone project-block-icon" style="--block-img: url('IMG/stone.png');"></div>
              <div>
                <div class="project-card-name">Castillo de Piedra</div>
                <div class="project-card-meta">Modificado hoy</div>
              </div>
            </div>
            <div class="project-card-footer">
              <span class="badge badge-stone">18 stacks</span>
              <span class="text-xs text-muted">→</span>
            </div>
          </div>

          <div class="project-card add-card" id="btnAddCard" onclick="crearProyecto()">
            <div style="font-size:32px; font-family:var(--font-pixel); line-height:1;">+</div>
            <div style="font-family:var(--font-pixel); font-size:8px; letter-spacing:0.5px;">Nuevo proyecto</div>
          </div>

        </div>

      </div>
    </div>

  </div>

<script>
    // Mostrar/ocultar Sidebar de forma fluida
    document.getElementById('toggleSidebar').addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('collapsed');
    });

    // Menú de perfil dropdown
    function toggleDropdown() {
        const menu = document.getElementById('dropdownMenu');
        if (menu.style.display === 'none') {
            menu.style.display = 'block';
        } else {
            menu.style.display = 'none';
        }
    }

    document.addEventListener('click', (e) => {
        const dd = document.getElementById('profileDropdown');
        const menu = document.getElementById('dropdownMenu');
        if (dd && !dd.contains(e.target) && menu) {
            menu.style.display = 'none';
        }
    });

    // Lógica de temas globales basados en clases del body
    function setTheme(mode) {
        document.body.classList.remove('colorblind-mode', 'mc-classic-theme');
        document.querySelectorAll('.dropdown-menu .btn').forEach(b => b.classList.remove('active-theme'));

        if (mode === 'colorblind') {
            document.body.classList.add('colorblind-mode');
            document.getElementById('theme-blind').classList.add('active-theme');
        } else if (mode === 'mc') {
            document.body.classList.add('mc-classic-theme');
            document.getElementById('theme-mc').classList.add('active-theme');
        } else {
            document.getElementById('theme-normal').classList.add('active-theme');
        }
        localStorage.setItem('craftlog_theme', mode);
    }

    // Inicializar el tema guardado
    const savedTheme = localStorage.getItem('craftlog_theme') || 'normal';
    setTheme(savedTheme);
</script>

<script src="JS/dashboard.js"></script>
</body>
</html>
