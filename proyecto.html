<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Proyecto — CraftLog</title>
  <link rel="icon" type="image/png" href="img/Logo.png">
  <link rel="stylesheet" href="CSS/base.css">
  <link rel="stylesheet" href="CSS/workspace.css">
<base target="_blank">
</head>
<body>

  <div class="app-shell" style="display: flex; flex-direction: column; min-height: 100vh;">

    <div style="display: flex; flex: 1; position: relative;">

      <!-- ========== SIDEBAR ========== -->
      <aside class="sidebar" id="sidebar" style="width: 240px; background: var(--bg-card); border-right: 1px solid var(--border-strong); display: flex; flex-direction: column; transition: width 0.3s;">
        <!-- Sección de proyectos (se llena dinámicamente desde JS) -->

        <!-- Enlace de regreso al dashboard -->
        <div style="padding: 16px; border-top: 1px solid var(--border-strong); margin-top: auto;">
          <a href="dashboard.html" style="font-size: var(--fs-body); color: var(--text-muted); display: flex; align-items: center; gap: 8px;">
            <span>←</span> Mis proyectos
          </a>
        </div>
      </aside>

      <!-- ========== CONTENIDO PRINCIPAL ========== -->
      <div style="flex: 1; display: flex; flex-direction: column; overflow: hidden;">

        <!-- ===== HEADER ===== -->
        <header style="height: 60px; background: var(--bg-card); border-bottom: 1px solid var(--border-strong); display: flex; align-items: center; justify-content: space-between; padding: 0 24px;">

          <!-- Izquierda: toggle + título -->
          <div class="flex items-center gap-sm">
            <button class="btn btn-secondary btn-sm" id="toggleSidebar" aria-label="Menú">☰</button>

            <div class="flex items-center" style="gap: 8px; margin-left: 12px;">
              <div style="width: 16px; height: 16px; background: var(--mc-stone); border-radius: 2px;"></div>
              <input
                type="text"
                id="projectTitle"
                value="Cargando..."
                style="background: transparent; border: none; outline: none; font-family: var(--font-pixel); font-size: var(--fs-pixel-sm); color: var(--text); width: 200px;"
                title="Haz clic para renombrar"
              >
            </div>
          </div>

          <!-- Derecha: botones + perfil -->
          <div class="flex items-center gap-sm">
            <button class="btn btn-secondary btn-sm" id="togglePanel">Lista ◀</button>

            <!-- Perfil con avatar dinámico -->
            <div class="dropdown" id="profileDropdown" style="position: relative;">
              <button class="btn btn-secondary btn-sm" id="avatarBtn" style="border-radius: 50%; padding: 0; width: 32px; height: 32px; font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center; background: #47D7E5; color: #1a1a2e; border: none; cursor: pointer;">
                ?
              </button>
              <div class="dropdown-menu" id="dropdownMenu" role="menu" style="display: none; position: absolute; right: 0; top: 120%; background: var(--bg-card); border: 1px solid var(--border-strong); border-radius: 6px; width: 200px; box-shadow: 0 8px 24px rgba(0,0,0,0.6); z-index: 100;">
                <div style="padding: 10px 16px; border-bottom: 1px solid var(--border);">
                  <div style="font-size: 13px; font-weight: 500;" id="dropdownUserName">Usuario</div>
                  <div class="text-xs text-muted" id="dropdownUserEmail">correo@ejemplo.com</div>
                </div>
                <div class="dropdown-sep"></div>
                <a href="dashboard.html" class="dropdown-item">Dashboard</a>
                <a href="login.html" class="dropdown-item danger" style="color: #ff5555;">Cerrar sesión</a>
              </div>
            </div>
          </div>
        </header>

        <!-- ===== WORKSPACE ===== -->
        <div class="workspace">

          <!-- CATÁLOGO DE BLOQUES -->
          <section class="catalog-panel">
            <div class="catalog-header">
              <input type="search" class="search-bar" placeholder="🔍 Buscar bloque o material..." id="searchBlocks">
            </div>

            <!-- INVENTARIO DEL USUARIO -->
            <div class="card" style="margin-bottom: 16px; border-color: var(--mc-gold); background: rgba(247, 201, 72, 0.03);">
              <div class="flex items-center justify-between mb-md">
                <span style="font-family: var(--font-pixel); font-size: 7px; color: var(--text-muted);">
                  Tu inventario
                </span>
                <div style="display: flex; gap: 6px;">
                  <button class="btn btn-ghost btn-sm" id="btnAgregarInventario" style="font-size: 11px;">+ Agregar</button>
                  <button class="btn btn-ghost btn-sm" id="btnLimpiarInventario" style="font-size: 11px; color: var(--text-red);">Limpiar</button>
                </div>
              </div>
              <div class="flex gap-sm" style="flex-wrap: wrap;" id="inventarioPreview">
                <span style="color: var(--text-muted); font-size: 12px;">No has agregado materiales a tu inventario</span>
              </div>
              <div style="margin-top: 8px; font-size: 11px; color: var(--text-muted);">
                Los materiales que tengas se restarán automáticamente al calcular
              </div>
            </div>

            <div class="catalog-section-title"> Catálogo de bloques</div>
            <div class="blocks-grid" id="blocksGrid">
              <!-- Se llena con JS -->
            </div>
          </section>

          <!-- PANEL DE LISTA A CALCULAR -->
          <aside class="summary-panel" id="summaryPanel">
            <div class="summary-header">
              <span class="summary-title">A calcular</span>
              <span class="badge badge-diamond" id="countBadge">0 items</span>
            </div>

            <ul class="summary-list" id="summaryList">
              <!-- Se llena con JS -->
            </ul>

            <div class="summary-footer">
              <div class="flex items-center justify-between text-xs" style="color: var(--text-muted);">
                <span>Total unidades</span>
                <span class="font-mono gold" style="font-size: 16px;" id="totalUnits">0</span>
              </div>
              <div class="flex items-center justify-between text-xs" style="color: var(--text-muted);">
                <span>Stacks completos</span>
                <span class="font-mono" style="font-size: 16px;" id="totalStacks">0</span>
              </div>
              <div class="pixel-divider" style="margin: 8px 0;"><span></span></div>
              <button class="btn btn-primary" id="btnCalcularProyecto">⬡ Calcular proyecto</button>
              <button class="btn btn-secondary btn-sm" id="btnLimpiar">Limpiar lista</button>
            </div>
          </aside>

          <!-- Botón flotante para mostrar panel (cuando está colapsado) -->
          <button class="btn btn-primary hidden" id="showPanelBtn" onclick="showPanel()" style="position: absolute; bottom: 24px; right: 24px; z-index: 50;">
            Lista ▶
          </button>

        </div>
      </div>
    </div>
  </div>

  <!-- ========== SCRIPTS ========== -->
  <script>
    // ── INTERRUPTOR DE ACCESIBILIDAD ──
    function initTheme() {
      const savedTheme = localStorage.getItem('craftlog_theme') || 'normal';
      document.body.classList.remove('mc-classic-theme', 'colorblind-mode');

      const titleInput = document.getElementById('projectTitle');

      if (savedTheme === 'mc') {
        document.body.classList.add('mc-classic-theme');
        if (titleInput) titleInput.style.fontFamily = "var(--font-pixel)";
      } else if (savedTheme === 'colorblind') {
        document.body.classList.add('colorblind-mode');
        if (titleInput) titleInput.style.fontFamily = "var(--font-text)";
      } else {
        if (titleInput) titleInput.style.fontFamily = "var(--font-text)";
      }
    }

    initTheme();

    // ── CONTROLES DE UI ──
    document.getElementById('toggleSidebar').addEventListener('click', () => {
      const sb = document.getElementById('sidebar');
      sb.style.width = sb.style.width === '0px' ? '240px' : '0px';
    });

    document.getElementById('togglePanel').addEventListener('click', () => {
      const panel = document.getElementById('summaryPanel');
      const showBtn = document.getElementById('showPanelBtn');
      const isCollapsed = panel.classList.toggle('collapsed');
      document.getElementById('togglePanel').textContent = isCollapsed ? '  Lista ▶' : '  Lista ◀';
      showBtn.classList.toggle('hidden', !isCollapsed);
    });

    function showPanel() {
      document.getElementById('summaryPanel').classList.remove('collapsed');
      document.getElementById('showPanelBtn').classList.add('hidden');
      document.getElementById('togglePanel').textContent = '  Lista ◀';
    }

    // ── DROPDOWN DE PERFIL ──
    document.getElementById('avatarBtn').addEventListener('click', function(e) {
      e.stopPropagation();
      const menu = document.getElementById('dropdownMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    });

    document.addEventListener('click', function(e) {
      const dd = document.getElementById('profileDropdown');
      if (dd && !dd.contains(e.target)) {
        document.getElementById('dropdownMenu').style.display = 'none';
      }
    });
  </script>

  <!-- Cargar el JS del proyecto -->
  <script src="JS/proyecto.js"></script>
</body>
</html>
